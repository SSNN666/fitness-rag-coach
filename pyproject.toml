[project]
name = "fitness-rag-coach"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pymilvus>=2.4.0",
    "rank-bm25>=0.2.2",
    "neo4j>=5.20.0",
    "jieba>=0.42.1",
    "cnocr>=2.3.0",
    "pdfplumber>=0.11.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-classic>=1.0.0",
    "langchain-ollama>=1.1.0",
    "pandas>=3.0.3",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "streamlit>=1.58.0",
    "tiktoken>=0.7.0",
    "milvus-lite>=3.1.0",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "mcp>=2.2.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
