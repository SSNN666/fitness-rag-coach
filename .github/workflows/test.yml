name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Verify imports
        run: |
          uv run python -c "
          from llm_adapter import build_llm, classify_error; print('adapter OK')
          from config import LLM_ROLES, LLM_FALLBACK_CHAIN; print('config OK')
          from gateway import Gateway, GatewayConfig; print('gateway OK')
          from guardrails import detect_injection; print('guardrails OK')
          from grounding import assess_grounding; print('grounding OK')
          "
